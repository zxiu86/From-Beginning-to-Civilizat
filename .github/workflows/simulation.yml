name: From Beginning to Civilization (Manual Run)

# STRICTLY MANUAL TRIGGER ONLY.
# No push, pull_request, schedule, release, or workflow_run triggers are permitted.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode: start_training | resume_training | promote_to_civilization | run_civilization | export_trained_population | verify_only"
        required: true
        default: "start_training"
        type: choice
        options:
          - start_training
          - resume_training
          - promote_to_civilization
          - run_civilization
          - export_trained_population
          - verify_only
      source_run_id:
        description: "Optional Run ID override (leave BLANK to automatically import the latest successful completed run)"
        required: false
        default: ""
        type: string
      runtime_budget_minutes:
        description: "Internal CPU budget in minutes (default 300 inside 360m GitHub limit)"
        required: true
        default: "300"
        type: string
      checkpoint_interval_minutes:
        description: "Periodic checkpoint interval in minutes"
        required: true
        default: "25"
        type: string
      max_ticks:
        description: "Optional hard tick cap for this run (blank = run until runtime budget)"
        required: false
        default: ""
        type: string
      world_seed:
        description: "Optional integer seed for start_training or promote_to_civilization (blank = random)"
        required: false
        default: ""
        type: string
      speed_mode:
        description: "realtime_1m_1mo (1 real min = 1 sim month) or max_cpu_research"
        required: true
        default: "max_cpu_research"
        type: choice
        options:
          - max_cpu_research
          - realtime_1m_1mo

permissions:
  contents: read
  actions: read

jobs:
  run-civilization-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned PyTorch CPU and simulation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Validate manual workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/training_checkpoint runs/training_package runs/imported_source runs/bundle runs/civ_checkpoint runs/logs
          SRC_ID="$(echo '${{ inputs.source_run_id }}' | xargs)"
          if [ -n "$SRC_ID" ] && ! [[ "$SRC_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Optional source_run_id must be a numeric GitHub Actions Run ID (or left blank for automatic selection)."
            exit 2
          fi
          python -c "
          b = float('${{ inputs.runtime_budget_minutes }}')
          assert 1.0 <= b <= 345.0, f'runtime_budget_minutes={b} must be between 1 and 345'
          c = float('${{ inputs.checkpoint_interval_minutes }}')
          assert 1.0 <= c <= 180.0, f'checkpoint_interval_minutes={c} must be between 1 and 180'
          mt = '${{ inputs.max_ticks }}'.strip()
          if mt:
              assert int(mt) >= 1, 'max_ticks must be >= 1'
          "

      # --- Automatic (or Optional Override) Source Run & Artifact Discovery ---
      - name: Resolve source run and artifact automatically
        id: resolve_source
        if: inputs.mode == 'resume_training' || inputs.mode == 'export_trained_population' || inputs.mode == 'promote_to_civilization' || inputs.mode == 'run_civilization'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci_artifact_transfer.py resolve-source \
            --mode "${{ inputs.mode }}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --workflow-file "simulation.yml" \
            --current-run-id "${{ github.run_id }}" \
            --token-env GITHUB_TOKEN \
            --github-output "$GITHUB_OUTPUT"

      - name: Download resolved source artifact
        if: inputs.mode == 'resume_training' || inputs.mode == 'export_trained_population' || inputs.mode == 'promote_to_civilization' || inputs.mode == 'run_civilization'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve_source.outputs.artifact_name }}
          run-id: ${{ steps.resolve_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/imported_source

      - name: Verify downloaded artifact integrity and completeness
        if: inputs.mode == 'resume_training' || inputs.mode == 'export_trained_population' || inputs.mode == 'promote_to_civilization' || inputs.mode == 'run_civilization'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_OUT=""
          if [ "${{ inputs.mode }}" = "promote_to_civilization" ]; then
            EXTRA_OUT="--verified-bundle-out runs/bundle/trained_population.bundle"
          elif [ "${{ inputs.mode }}" = "resume_training" ] || [ "${{ inputs.mode }}" = "export_trained_population" ]; then
            EXTRA_OUT="--verified-checkpoint-out runs/training_checkpoint"
          elif [ "${{ inputs.mode }}" = "run_civilization" ]; then
            EXTRA_OUT="--verified-checkpoint-out runs/civ_checkpoint"
          fi
          python scripts/ci_artifact_transfer.py verify-downloaded \
            --download-dir runs/imported_source \
            --expected-run-id "${{ steps.resolve_source.outputs.run_id }}" \
            --artifact-kind "${{ steps.resolve_source.outputs.artifact_kind }}" \
            --mode "${{ inputs.mode }}" \
            --require-torch \
            $EXTRA_OUT

      # --- Execute requested mode (strict PyTorch CPU enforced) ---
      - name: Run full verification suite and CPU benchmark (verify_only)
        if: inputs.mode == 'verify_only'
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m benchmarks.benchmark_cpu --require-torch --ticks 120 --output runs/logs/benchmark_report.json

      - name: Start isolated survival training (100 clones of shared template)
        if: inputs.mode == 'start_training'
        shell: bash
        run: |
          SEED_VAL="${{ inputs.world_seed }}"
          if [ -z "$SEED_VAL" ]; then
            SEED_VAL=$(python -c "import random; print(random.SystemRandom().randint(1, 2147483647))")
          fi
          EXTRA_ARGS=""
          if [ -n "${{ inputs.max_ticks }}" ]; then
            EXTRA_ARGS="--max-ticks ${{ inputs.max_ticks }}"
          fi
          python -m sim.cli start-training \
            --checkpoint-dir runs/training_checkpoint \
            --seed "$SEED_VAL" \
            --agent-count 100 \
            --runtime-budget-minutes "${{ inputs.runtime_budget_minutes }}" \
            --shutdown-reserve-minutes 12 \
            --checkpoint-interval-minutes "${{ inputs.checkpoint_interval_minutes }}" \
            --speed-mode "${{ inputs.speed_mode }}" \
            --require-torch \
            --log-file runs/logs/training.log $EXTRA_ARGS

      - name: Resume isolated survival training
        if: inputs.mode == 'resume_training'
        shell: bash
        run: |
          python -m sim.cli inspect-training --checkpoint-dir runs/training_checkpoint
          EXTRA_ARGS=""
          if [ -n "${{ inputs.max_ticks }}" ]; then
            EXTRA_ARGS="--max-ticks ${{ inputs.max_ticks }}"
          fi
          python -m sim.cli resume-training \
            --checkpoint-dir runs/training_checkpoint \
            --runtime-budget-minutes "${{ inputs.runtime_budget_minutes }}" \
            --shutdown-reserve-minutes 12 \
            --checkpoint-interval-minutes "${{ inputs.checkpoint_interval_minutes }}" \
            --speed-mode "${{ inputs.speed_mode }}" \
            --require-torch \
            --log-file runs/logs/training.log $EXTRA_ARGS

      - name: Package completed isolated training into one verified artifact
        if: (inputs.mode == 'start_training' || inputs.mode == 'resume_training') && success()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_artifact_transfer.py package-training \
            --checkpoint-dir runs/training_checkpoint \
            --output-dir runs/training_package \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --workflow-mode "${{ inputs.mode }}" \
            --require-torch

      - name: Export trained 100-agent population to single compressed bundle
        if: inputs.mode == 'export_trained_population'
        shell: bash
        run: |
          python -m sim.cli inspect-training --checkpoint-dir runs/training_checkpoint
          python -m sim.cli export-population \
            --checkpoint-dir runs/training_checkpoint \
            --output-bundle runs/bundle/trained_population.bundle \
            --source-run-id "${{ steps.resolve_source.outputs.run_id }}" \
            --require-torch
          python -m sim.cli verify-bundle \
            --bundle-path runs/bundle/trained_population.bundle \
            --expected-run-id "${{ steps.resolve_source.outputs.run_id }}" \
            --require-torch
          cp runs/training_checkpoint/observatory_export.json runs/logs/observatory_export.json

      - name: Promote trained population bundle and start Full Civilization World
        if: inputs.mode == 'promote_to_civilization'
        shell: bash
        run: |
          set -euo pipefail
          EXP_ARGS=""
          if [ "${{ steps.resolve_source.outputs.artifact_kind }}" = "isolated_training_package" ]; then
            EXP_ARGS="--expected-run-id ${{ steps.resolve_source.outputs.run_id }}"
          fi
          python -m sim.cli verify-bundle \
            --bundle-path runs/bundle/trained_population.bundle \
            $EXP_ARGS \
            --require-torch
          SEED_VAL="${{ inputs.world_seed }}"
          if [ -z "$SEED_VAL" ]; then
            SEED_VAL=$(python -c "import random; print(random.SystemRandom().randint(1, 2147483647))")
          fi
          EXTRA_ARGS=""
          if [ -n "${{ inputs.max_ticks }}" ]; then
            EXTRA_ARGS="--max-ticks ${{ inputs.max_ticks }}"
          fi
          python -m sim.cli promote-to-civilization \
            --bundle-path runs/bundle/trained_population.bundle \
            --checkpoint-dir runs/civ_checkpoint \
            --seed "$SEED_VAL" \
            $EXP_ARGS \
            --run-simulation \
            --runtime-budget-minutes "${{ inputs.runtime_budget_minutes }}" \
            --shutdown-reserve-minutes 12 \
            --checkpoint-interval-minutes "${{ inputs.checkpoint_interval_minutes }}" \
            --speed-mode "${{ inputs.speed_mode }}" \
            --require-torch \
            --log-file runs/logs/civilization.log $EXTRA_ARGS

      - name: Continue promoted Civilization World simulation
        if: inputs.mode == 'run_civilization'
        shell: bash
        run: |
          python -m sim.cli inspect-world --checkpoint-dir runs/civ_checkpoint
          EXTRA_ARGS=""
          if [ -n "${{ inputs.max_ticks }}" ]; then
            EXTRA_ARGS="--max-ticks ${{ inputs.max_ticks }}"
          fi
          python -m sim.cli run-civilization \
            --checkpoint-dir runs/civ_checkpoint \
            --runtime-budget-minutes "${{ inputs.runtime_budget_minutes }}" \
            --shutdown-reserve-minutes 12 \
            --checkpoint-interval-minutes "${{ inputs.checkpoint_interval_minutes }}" \
            --speed-mode "${{ inputs.speed_mode }}" \
            --require-torch \
            --log-file runs/logs/civilization.log $EXTRA_ARGS

      # --- Verify final artifacts & write clear Run ID summary ---
      - name: Verify final artifact integrity & print summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Run Summary"
            echo "- **Run ID**: \`${{ github.run_id }}\`"
            echo "- **Mode**: \`${{ inputs.mode }}\`"
            echo "- **Resolved Source Run ID**: \`${{ steps.resolve_source.outputs.run_id || inputs.source_run_id || 'none' }}\` (auto=\`${{ steps.resolve_source.outputs.resolved_automatically || 'n/a' }}\`)"
            if [ -n "${{ steps.resolve_source.outputs.artifact_name || '' }}" ]; then
              echo "- **Imported Artifact**: \`${{ steps.resolve_source.outputs.artifact_name }}\` (\`${{ steps.resolve_source.outputs.artifact_kind }}\`)"
            fi
            if [ -f runs/training_package/transfer_metadata.json ]; then
              cp runs/training_package/transfer_metadata.json runs/logs/transfer_metadata.json
              echo "- **Unified Training Artifact**: \`isolated-training-artifact-${{ github.run_id }}\`"
            fi
            if [ -f runs/training_checkpoint/manifest.json ]; then
              python -m sim.cli inspect-training --checkpoint-dir runs/training_checkpoint > runs/logs/final_training_inspection.json || true
              [ -f runs/training_checkpoint/observatory_export.json ] && cp runs/training_checkpoint/observatory_export.json runs/logs/observatory_export.json || true
              cp runs/training_checkpoint/manifest.json runs/logs/manifest.json
            fi
            if [ -f runs/bundle/trained_population.bundle ]; then
              echo "- **Bundle Path**: \`trained_population.bundle\`"
            fi
            if [ -f runs/civ_checkpoint/manifest.json ]; then
              python -m sim.cli inspect-world --checkpoint-dir runs/civ_checkpoint > runs/logs/final_world_inspection.json || true
              [ -f runs/civ_checkpoint/observatory_export.json ] && cp runs/civ_checkpoint/observatory_export.json runs/logs/observatory_export.json || true
              cp runs/civ_checkpoint/manifest.json runs/logs/manifest.json
              echo "- **Civilization Artifact**: \`sim-checkpoint-${{ github.run_id }}\`"
            fi
            echo "- **Logs & Observatory Snapshot Artifact**: \`sim-logs-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ONLY upload training/bundle/civilization artifacts when the workflow succeeded cleanly.
      - name: Upload single organized isolated training artifact
        if: (inputs.mode == 'start_training' || inputs.mode == 'resume_training') && success()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-training-artifact-${{ github.run_id }}
          path: runs/training_package
          retention-days: 90
          if-no-files-found: error

      - name: Upload single-file trained population bundle artifact
        if: inputs.mode == 'export_trained_population' && success()
        uses: actions/upload-artifact@v4
        with:
          name: trained-population-bundle-${{ github.run_id }}
          path: runs/bundle/trained_population.bundle
          retention-days: 90
          if-no-files-found: error

      - name: Upload civilization checkpoint artifact
        if: (inputs.mode == 'promote_to_civilization' || inputs.mode == 'run_civilization') && success()
        uses: actions/upload-artifact@v4
        with:
          name: sim-checkpoint-${{ github.run_id }}
          path: runs/civ_checkpoint
          retention-days: 90
          if-no-files-found: error

      - name: Upload simulation logs and observatory export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ github.run_id }}
          path: runs/logs
          retention-days: 90
          if-no-files-found: warn
