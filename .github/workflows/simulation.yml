name: From Beginning to Civilization (Manual Run)

# STRICTLY MANUAL TRIGGER ONLY.
# No push, pull_request, schedule, release, or workflow_run triggers are permitted.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode: new_world | resume_world | verify_only"
        required: true
        default: "new_world"
        type: choice
        options:
          - new_world
          - resume_world
          - verify_only
      resume_run_id:
        description: "Required when mode=resume_world: previous GitHub Actions Run ID holding sim-checkpoint-<run_id>"
        required: false
        default: ""
        type: string
      runtime_budget_minutes:
        description: "Internal CPU budget in minutes (default 300 inside 360m GitHub limit)"
        required: true
        default: "300"
        type: string
      checkpoint_interval_minutes:
        description: "Periodic checkpoint interval in minutes"
        required: true
        default: "25"
        type: string
      world_seed:
        description: "Optional integer seed when mode=new_world (blank = random)"
        required: false
        default: ""
        type: string
      speed_mode:
        description: "realtime_1m_1mo (1 real min = 1 sim month) or max_cpu_research"
        required: true
        default: "max_cpu_research"
        type: choice
        options:
          - max_cpu_research
          - realtime_1m_1mo

permissions:
  contents: read
  actions: read

jobs:
  run-civilization-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned PyTorch CPU and simulation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Validate manual inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/active_checkpoint runs/logs
          if [ "${{ inputs.mode }}" = "resume_world" ]; then
            if [ -z "${{ inputs.resume_run_id }}" ]; then
              echo "ERROR: mode=resume_world requires a valid 'resume_run_id'. Refusing to start a new world."
              exit 2
            fi
            if ! [[ "${{ inputs.resume_run_id }}" =~ ^[0-9]+$ ]]; then
              echo "ERROR: resume_run_id must be a numeric GitHub Actions Run ID."
              exit 2
            fi
          fi
          python -c "
          b = float('${{ inputs.runtime_budget_minutes }}')
          assert 1.0 <= b <= 345.0, f'runtime_budget_minutes={b} must be between 1 and 345'
          c = float('${{ inputs.checkpoint_interval_minutes }}')
          assert 1.0 <= c <= 180.0, f'checkpoint_interval_minutes={c} must be between 1 and 180'
          "

      - name: Download previous checkpoint artifact when resuming
        if: inputs.mode == 'resume_world'
        uses: actions/download-artifact@v4
        with:
          name: sim-checkpoint-${{ inputs.resume_run_id }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/active_checkpoint

      - name: Verify downloaded checkpoint integrity before resuming
        if: inputs.mode == 'resume_world'
        run: |
          python -m sim.cli inspect-world --checkpoint-dir runs/active_checkpoint

      - name: Run full verification suite and CPU benchmark (PyTorch CPU enforced)
        if: inputs.mode == 'verify_only'
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m benchmarks.benchmark_cpu --require-torch --ticks 120 --output runs/logs/benchmark_report.json

      - name: Run new world simulation (PyTorch CPU enforced)
        if: inputs.mode == 'new_world'
        shell: bash
        run: |
          SEED_VAL="${{ inputs.world_seed }}"
          if [ -z "$SEED_VAL" ]; then
            SEED_VAL=$(python -c "import random; print(random.SystemRandom().randint(1, 2147483647))")
          fi
          echo "Starting new world with seed=$SEED_VAL"
          python -m sim.cli new-world \
            --checkpoint-dir runs/active_checkpoint \
            --seed "$SEED_VAL" \
            --initial-population 100 \
            --runtime-budget-minutes "${{ inputs.runtime_budget_minutes }}" \
            --shutdown-reserve-minutes 12 \
            --checkpoint-interval-minutes "${{ inputs.checkpoint_interval_minutes }}" \
            --speed-mode "${{ inputs.speed_mode }}" \
            --require-torch \
            --log-file runs/logs/simulation.log

      - name: Resume existing world simulation (PyTorch CPU enforced)
        if: inputs.mode == 'resume_world'
        run: |
          python -m sim.cli resume-world \
            --checkpoint-dir runs/active_checkpoint \
            --runtime-budget-minutes "${{ inputs.runtime_budget_minutes }}" \
            --shutdown-reserve-minutes 12 \
            --checkpoint-interval-minutes "${{ inputs.checkpoint_interval_minutes }}" \
            --speed-mode "${{ inputs.speed_mode }}" \
            --require-torch \
            --log-file runs/logs/simulation.log

      - name: Verify final checkpoint integrity
        if: inputs.mode != 'verify_only' && always()
        run: |
          if [ -f runs/active_checkpoint/manifest.json ]; then
            python -m sim.cli inspect-world --checkpoint-dir runs/active_checkpoint > runs/logs/final_inspection.json
            cat runs/logs/final_inspection.json
          fi

      - name: Upload checkpoint artifact (persistent across runs)
        if: inputs.mode != 'verify_only' && always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-checkpoint-${{ github.run_id }}
          path: runs/active_checkpoint
          retention-days: 90
          if-no-files-found: error

      - name: Upload simulation logs and observatory export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ github.run_id }}
          path: |
            runs/logs
            runs/active_checkpoint/observatory_export.json
            runs/active_checkpoint/manifest.json
          retention-days: 90
          if-no-files-found: warn
